AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ZeroDrop - Zero-Knowledge, Bot-Proof, Approval-Gated Secret & File Escrow.
  100% Serverless (CloudFront, S3, API Gateway HTTP API, Lambda, Step Functions,
  DynamoDB, KMS, SNS). Zero servers and zero CI/CD pipelines to manage.

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address to receive Break-Glass SNS approval requests & burn receipts.
  IpHashSalt:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Required private random salt used to hash requester IPs before storage.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    Timeout: 20
    MemorySize: 256
    Environment:
      Variables:
        DROPS_TABLE: !Ref DropsTable
        VAULT_BUCKET: !Ref VaultBucket
        KMS_KEY_ID: !Ref SigningKey
        ALERTS_TOPIC_ARN: !Ref AlertsTopic
        IP_HASH_SALT: !Ref IpHashSalt

Resources:
  DropsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: drop_id
          AttributeType: S
      KeySchema:
        - AttributeName: drop_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl_epoch
        Enabled: true

  VaultBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AutoShredEncryptedBlobsAfter7Days
            Prefix: vault/
            Status: Enabled
            ExpirationInDays: 7

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: ZeroDrop ECDSA NIST P-256 signing key for tamper-proof burn receipts
      KeyUsage: SIGN_VERIFY
      KeySpec: ECC_NIST_P256
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: ZeroDrop Security Alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  WorkflowTaskFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-workflow"
      RetentionInDays: 14

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  BotShieldBlockedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiFunctionLogGroup
      FilterPattern: '{ $.event_type = "BOT_SHIELD_BLOCKED" }'
      MetricTransformations:
        - MetricNamespace: ZeroDrop/Security
          MetricName: BotShieldBlockedCount
          MetricValue: "1"

  CanaryTripwireMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiFunctionLogGroup
      FilterPattern: '{ $.event_type = "CANARY_TRIPWIRE" }'
      MetricTransformations:
        - MetricNamespace: ZeroDrop/Security
          MetricName: CanaryTripwireCount
          MetricValue: "1"

  PanicShredMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiFunctionLogGroup
      FilterPattern: '{ $.event_type = "OWNER_PANIC_SHREDDED" }'
      MetricTransformations:
        - MetricNamespace: ZeroDrop/Security
          MetricName: PanicShredCount
          MetricValue: "1"

  CanaryTripwireAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Fires when a ZeroDrop Canary Honeypot tripwire is triggered
      Namespace: ZeroDrop/Security
      MetricName: CanaryTripwireCount
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  WorkflowTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: workflow_tasks.lambda_handler
      LoggingConfig:
        LogGroup: !Ref WorkflowTaskFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt DropsTable.Arn
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - kms:Sign
                - kms:GetPublicKey
              Resource: !GetAtt SigningKey.Arn

  ApprovalStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-approval"
      Type: STANDARD
      DefinitionUri: statemachine/approval_shred.asl.json
      DefinitionSubstitutions:
        WorkflowTaskFunctionArn: !GetAtt WorkflowTaskFunction.Arn
        DropsTableName: !Ref DropsTable
        VaultBucketName: !Ref VaultBucket
        AlertsTopicArn: !Ref AlertsTopic
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref WorkflowTaskFunction
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt DropsTable.Arn
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "${VaultBucket.Arn}/*"

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-ZeroDrop-Human
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api_handler.lambda_handler
      Timeout: 25
      LoggingConfig:
        LogGroup: !Ref ApiFunctionLogGroup
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ApprovalStateMachine
          REVIEW_BASE_URL: !Sub "https://${CloudFrontDistribution.DomainName}"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt DropsTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "${VaultBucket.Arn}/*"
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref ApprovalStateMachine
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: "*"
            - Effect: Allow
              Action:
                - states:StopExecution
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-approval:*"
            - Effect: Allow
              Action:
                - kms:Sign
                - kms:GetPublicKey
              Resource: !GetAtt SigningKey.Arn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
        PublicKey:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/public-key
            Method: GET
        GetSocTelemetry:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/telemetry/soc
            Method: GET
        CreateDrop:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/drops
            Method: POST
        DropStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/drops/{id}/status
            Method: GET
        ClaimDrop:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/drops/{id}/claim
            Method: POST
        CollectDrop:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/drops/{id}/collect
            Method: POST
        ConfirmShred:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/drops/{id}/confirm-shred
            Method: POST
        PanicShred:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/drops/{id}/shred
            Method: POST
        GetReceipt:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/receipts/{id}
            Method: GET
        GetApproval:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/approvals/{token}
            Method: GET
        PostApproval:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/approvals/{token}
            Method: POST
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: WebS3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: HttpApiOrigin
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: WebS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: HttpApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  VaultBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref VaultBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLSOnlyInTransit
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt VaultBucket.Arn
              - !Sub "${VaultBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  ZeroDropOpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-serverless-ops"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations & Errors (Scale-to-Zero)",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}"],
                  [".", "Errors", ".", "${ApiFunction}"],
                  [".", "Invocations", ".", "${WorkflowTaskFunction}"],
                  [".", "Errors", ".", "${WorkflowTaskFunction}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "HTTP API Requests & 4XX/5XX",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", "Stage", "$default"],
                  [".", "4xx", ".", "${HttpApi}", ".", "$default"],
                  [".", "5xx", ".", "${HttpApi}", ".", "$default"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Step Functions Break-Glass Workflows",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  ["AWS/States", "ExecutionsStarted", "StateMachineArn", "${ApprovalStateMachine}"],
                  [".", "ExecutionsSucceeded", ".", "${ApprovalStateMachine}"],
                  [".", "ExecutionsFailed", ".", "${ApprovalStateMachine}"],
                  [".", "ExecutionsTimedOut", ".", "${ApprovalStateMachine}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB On-Demand Read/Write Units",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${DropsTable}"],
                  [".", "ConsumedWriteCapacityUnits", ".", "${DropsTable}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 24, "height": 5,
              "properties": {
                "title": "ZeroDrop Security Telemetry (Bot Shield / Canary Tripwires / Panic Shreds)",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  ["ZeroDrop/Security", "BotShieldBlockedCount"],
                  [".", "CanaryTripwireCount"],
                  [".", "PanicShredCount"]
                ]
              }
            }
          ]
        }

Outputs:
  WebsiteUrl:
    Description: Public HTTPS CloudFront URL for ZeroDrop
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  ApiBaseUrl:
    Description: Direct API Gateway HTTP API endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DashboardUrl:
    Description: CloudWatch Serverless Observability Dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-serverless-ops"
  WebBucketName:
    Description: S3 Bucket holding index.html
    Value: !Ref WebBucket
  VaultBucketName:
    Description: Private S3 Bucket holding temporary encrypted files
    Value: !Ref VaultBucket
  DropsTableName:
    Description: DynamoDB table name
    Value: !Ref DropsTable
  StateMachineArn:
    Description: Step Functions State Machine ARN
    Value: !Ref ApprovalStateMachine
  KmsKeyId:
    Description: AWS KMS Asymmetric Signing Key ID
    Value: !Ref SigningKey
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
