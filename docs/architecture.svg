<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111a2e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f472b6" />
    </marker>
  </defs>

  <rect width="1120" height="680" fill="url(#bgGrad)" rx="16" />

  <!-- Header -->
  <text x="40" y="48" fill="#e6edf7" font-size="24" font-weight="800">ZeroDrop v4.0 APEX — AWS / SAM Architecture Design</text>
  <text x="40" y="74" fill="#93a4c3" font-size="13">Resources described in template.yaml • No AWS deployment in this repository snapshot</text>
  <rect x="850" y="28" width="230" height="32" rx="16" fill="rgba(248,113,113,0.14)" stroke="#f87171" stroke-width="1.2" />
  <text x="965" y="49" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">NOT DEPLOYED / NOT LIVE-VERIFIED</text>

  <!-- Browser Zone -->
  <rect x="35" y="105" width="240" height="445" rx="14" fill="#121826" stroke="#38bdf8" stroke-width="1.5" />
  <text x="155" y="132" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">Client Browser (Zero-Knowledge)</text>

  <rect x="55" y="150" width="200" height="84" rx="10" fill="#182135" stroke="#26324d" />
  <text x="155" y="174" fill="#e6edf7" font-size="12.5" font-weight="700" text-anchor="middle">AES-GCM + Shamir + PBKDF2</text>
  <text x="155" y="194" fill="#93a4c3" font-size="11" text-anchor="middle">M-of-N GF(256) Share Split</text>
  <text x="155" y="212" fill="#86efac" font-size="11" text-anchor="middle">Zero-Burn Local Pre-Check</text>

  <rect x="55" y="252" width="200" height="82" rx="10" fill="#182135" stroke="#26324d" />
  <text x="155" y="276" fill="#e6edf7" font-size="13" font-weight="700" text-anchor="middle">Bots + Canary Honeypots</text>
  <text x="155" y="296" fill="#fde68a" font-size="11" text-anchor="middle">POST /claim blocked (403)</text>
  <text x="155" y="314" fill="#f87171" font-size="11" text-anchor="middle">Instant SNS Intrusion Alert</text>

  <rect x="55" y="352" width="200" height="82" rx="10" fill="#182135" stroke="#26324d" />
  <text x="155" y="376" fill="#e6edf7" font-size="13" font-weight="700" text-anchor="middle">20-Request Race Lab</text>
  <text x="155" y="396" fill="#93a4c3" font-size="11" text-anchor="middle">Local in-memory race tested</text>
  <text x="155" y="414" fill="#fca5a5" font-size="11" text-anchor="middle">Deployed API race not run</text>

  <rect x="55" y="452" width="200" height="80" rx="10" fill="#182135" stroke="#26324d" />
  <text x="155" y="476" fill="#e6edf7" font-size="13" font-weight="700" text-anchor="middle">Hash-Chained Audit Ledger</text>
  <text x="155" y="496" fill="#93a4c3" font-size="11" text-anchor="middle">Local signing; AWS KMS untested</text>
  <text x="155" y="514" fill="#fca5a5" font-size="11" text-anchor="middle">1-Char Cascade Tampering</text>

  <!-- Edge & API -->
  <rect x="325" y="105" width="215" height="120" rx="12" fill="#162038" stroke="#818cf8" stroke-width="1.5" />
  <text x="432" y="132" fill="#c7d2fe" font-size="14" font-weight="700" text-anchor="middle">Amazon CloudFront</text>
  <text x="432" y="153" fill="#93a4c3" font-size="11.5" text-anchor="middle">HTTPS + SecurityHeadersPolicy</text>
  <text x="432" y="172" fill="#93a4c3" font-size="11.5" text-anchor="middle">GET /* → Private S3 (OAC)</text>
  <text x="432" y="191" fill="#38bdf8" font-size="11.5" text-anchor="middle">/api/* → HTTP API (No CORS pain)</text>

  <rect x="325" y="255" width="215" height="90" rx="12" fill="#162038" stroke="#38bdf8" stroke-width="1.5" />
  <text x="432" y="283" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">Amazon API Gateway</text>
  <text x="432" y="303" fill="#93a4c3" font-size="12" text-anchor="middle">AWS HTTP API v2 type • 25 req/s throttle</text>
  <text x="432" y="322" fill="#93a4c3" font-size="11" text-anchor="middle">/drops • /claim • /approvals • /lab</text>

  <rect x="325" y="375" width="215" height="105" rx="12" fill="#162038" stroke="#f59e0b" stroke-width="1.5" />
  <text x="432" y="403" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">AWS Lambda (ApiFunction)</text>
  <text x="432" y="424" fill="#93a4c3" font-size="11.5" text-anchor="middle">Python 3.13 • arm64 • Zero deps</text>
  <text x="432" y="443" fill="#93a4c3" font-size="11.5" text-anchor="middle">Fast Atomic Burn + Bot Shield</text>
  <text x="432" y="462" fill="#93a4c3" font-size="11.5" text-anchor="middle">Starts SFN &amp; SendTaskSuccess</text>

  <!-- Data & Crypto Layer -->
  <rect x="605" y="105" width="230" height="120" rx="12" fill="#121826" stroke="#22c55e" stroke-width="1.5" />
  <text x="720" y="132" fill="#86efac" font-size="14" font-weight="700" text-anchor="middle">Amazon DynamoDB</text>
  <text x="720" y="153" fill="#e6edf7" font-size="11.5" text-anchor="middle">Per-drop TTL: 5 min–7 days</text>
  <text x="720" y="173" fill="#93a4c3" font-size="11" text-anchor="middle">Atomic UpdateItem (ReturnValues:</text>
  <text x="720" y="191" fill="#93a4c3" font-size="11" text-anchor="middle">ALL_OLD + REMOVE ciphertext)</text>

  <rect x="605" y="250" width="230" height="105" rx="12" fill="#121826" stroke="#22c55e" stroke-width="1.5" />
  <text x="720" y="277" fill="#86efac" font-size="14" font-weight="700" text-anchor="middle">Amazon S3 (VaultBucket)</text>
  <text x="720" y="298" fill="#93a4c3" font-size="11.5" text-anchor="middle">Direct Presigned PUT/GET (≤25 MB)</text>
  <text x="720" y="317" fill="#93a4c3" font-size="11.5" text-anchor="middle">7-Day Lifecycle Backstop + Shred</text>
  <text x="720" y="336" fill="#93a4c3" font-size="11" text-anchor="middle">(WebBucket also private via OAC)</text>

  <rect x="605" y="380" width="230" height="100" rx="12" fill="#121826" stroke="#f472b6" stroke-width="1.5" />
  <text x="720" y="408" fill="#f9a8d4" font-size="14" font-weight="700" text-anchor="middle">AWS KMS (ECC_NIST_P256)</text>
  <text x="720" y="429" fill="#93a4c3" font-size="11.5" text-anchor="middle">Asymmetric ECDSA_SHA_256 Sign</text>
  <text x="720" y="448" fill="#93a4c3" font-size="11.5" text-anchor="middle">Private key never leaves HSM</text>
  <text x="720" y="466" fill="#93a4c3" font-size="11" text-anchor="middle">DER → P1363 for Browser Verify</text>

  <!-- Step Functions & SNS Orchestration -->
  <rect x="880" y="105" width="205" height="375" rx="14" fill="#161426" stroke="#f472b6" stroke-width="1.5" />
  <text x="982" y="132" fill="#f9a8d4" font-size="14" font-weight="700" text-anchor="middle">AWS Step Functions</text>
  <text x="982" y="150" fill="#93a4c3" font-size="11" text-anchor="middle">Break-Glass Approval Workflow</text>

  <rect x="896" y="166" width="173" height="62" rx="8" fill="#211d36" stroke="#f472b6" />
  <text x="982" y="188" fill="#e6edf7" font-size="12" font-weight="700" text-anchor="middle">1. waitForTaskToken</text>
  <text x="982" y="206" fill="#fde68a" font-size="10.5" text-anchor="middle">Owner review timeout: 60 min</text>
  <text x="982" y="220" fill="#93a4c3" font-size="10" text-anchor="middle">Sends SNS Review Alert</text>

  <rect x="896" y="242" width="173" height="54" rx="8" fill="#211d36" stroke="#38bdf8" />
  <text x="982" y="264" fill="#e6edf7" font-size="12" font-weight="700" text-anchor="middle">2. Choice + Release</text>
  <text x="982" y="282" fill="#93a4c3" font-size="10.5" text-anchor="middle">Approve → KMS Sign + 90s Wait</text>

  <rect x="896" y="310" width="173" height="72" rx="8" fill="#211d36" stroke="#22c55e" />
  <text x="982" y="331" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">3. Parallel SDK Shred</text>
  <text x="982" y="349" fill="#93a4c3" font-size="10.5" text-anchor="middle">• dynamodb:updateItem</text>
  <text x="982" y="364" fill="#93a4c3" font-size="10.5" text-anchor="middle">• s3:deleteObject • sns:publish</text>

  <rect x="896" y="396" width="173" height="68" rx="8" fill="#182135" stroke="#f59e0b" />
  <text x="982" y="420" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Amazon SNS</text>
  <text x="982" y="438" fill="#93a4c3" font-size="10.5" text-anchor="middle">Scanner-Safe Owner Alerts</text>
  <text x="982" y="453" fill="#93a4c3" font-size="10.5" text-anchor="middle">&amp; KMS Burn Audit Receipts</text>

  <!-- Arrows -->
  <line x1="275" y1="165" x2="320" y2="165" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="275" y1="295" x2="600" y2="295" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrowGreen)" />
  <text x="285" y="245" fill="#86efac" font-size="10" transform="rotate(-12 285 245)">Direct Encrypted PUT/GET</text>

  <line x1="432" y1="225" x2="432" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="432" y1="345" x2="432" y2="370" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />

  <line x1="540" y1="395" x2="600" y2="175" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)" />
  <line x1="540" y1="420" x2="600" y2="310" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrowGreen)" />
  <line x1="540" y1="445" x2="600" y2="435" stroke="#f472b6" stroke-width="2" marker-end="url(#arrowPink)" />
  <line x1="540" y1="465" x2="875" y2="205" stroke="#f472b6" stroke-width="2" marker-end="url(#arrowPink)" />

  <!-- Bottom Status Strip -->
  <rect x="35" y="575" width="1050" height="75" rx="12" fill="#121826" stroke="#26324d" />
  <text x="58" y="604" fill="#38bdf8" font-size="14" font-weight="700">Template-defined AWS architecture • Local-only checks in this snapshot</text>
  <text x="58" y="628" fill="#c7d6f3" font-size="12" font-family="ui-monospace, Menlo, monospace">Local tests: pytest + emulator  |  SOC API: aggregate counters only, no event list  |  No AWS deployment or live check</text>
</svg>
